<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1621" />
    <meta name="description" content="Rehearsal companion for a cappella groups: play any voice, alone or in sync." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LightScore" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>LightScore</title>
    <script>
      // The look before anything has loaded (design.ts decides it again), so a device in light mode
      // doesn't see night paper for a moment.
      try {
        var asked = new URLSearchParams(location.search).get('design');
        var d = /^(auto|samt|papier|pergament)$/.test(asked || '') ? asked : localStorage.getItem('ai-capella-design') || 'auto';
        if (d === 'auto') d = matchMedia('(prefers-color-scheme: light)').matches ? 'pergament' : 'papier';
        document.documentElement.dataset.design = d === 'samt' ? 'samt' : 'papier';
        if (d === 'pergament') {
          document.documentElement.dataset.ground = 'pergament';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#E8D9B8');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
